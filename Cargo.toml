[package]
name = "zerodns"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
authors = ["Jeffsky Tsai <jjeffcaii@outlook.com>"]
repository = "https://github.com/jjeffcaii/zerodns"
homepage = "https://github.com/jjeffcaii/zerodns"
description = "A DNS server in Rust, which is inspired from chinadns/dnsmasq."
include = [
    "**/*.rs",
    "Cargo.toml",
]

[profile.release]
lto = "thin"

[build-dependencies]
string_cache_codegen = "0.6"

[dependencies]
log = "0.4"
slog = "2.8"
slog-async = "2.8"
slog-term = "2.9"
slog-stdlog = "4.1"
slog-scope = "4.4"
arc-swap = "1.9"
chrono = "0.4"
bytesize = { version = "2.3", features = ["serde"] }
byteorder = "1.5"
base64 = "0.22"
bytes = "1.11"
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
anyhow = "1"
thiserror = "2.0"
cfg-if = "1"
clap = { version = "4.5", features = ["derive", "cargo"] }
once_cell = "1.21"
futures = "0.3"
parking_lot = "0.12"
async-trait = "0.1"
smallvec = { version = "1.14", features = ["write"] }
ahash = "0.8"
hashbrown = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
glob = "0.3"
maxminddb = "0.28"
moka = { version = "0.12", features = ["future", "sync"] }
url = "2.5"
regex = "1.12"
hex = "0.4"
strum = { version = "0.28", default-features = false, features = ["strum_macros", "derive"] }
strum_macros = "0.28"
deadpool = "0.13"
socket2 = { version = "0.6", features = ["all"] }
mlua = { version = "0.11", features = ["luajit", "vendored", "serialize", "async", "macros", "send", "anyhow"] }
rquickjs = { version = "0.11", features = ["macro", "full-async", "futures", "parallel", "classes"] }
garde = { version = "0.22", features = ["serde", "derive", "regex"] }
rustls = { version = "0.23" }
tokio-rustls = "0.26"
httparse = "1.10"
http = "1.4"
string_cache = "0.9"
rand = "0.10"
resolv-conf = "0.7"
bitflags = "2.11"
sha2 = "0.11"

hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = { version = "0.27", features = ["aws-lc-rs", "http1", "native-tokio", "tls12", "logging"] }

[dev-dependencies]
hex = "0.4"
pretty_env_logger = "0.5"
tokio-shared-rt = "*"
